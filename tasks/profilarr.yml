# https://wiki.serversatho.me/en/profilarr

- name: Install Python tools for docker
  ansible.builtin.pip:
    name: docker==7.1.0
  tags:
    - profilarr
    - arr

- name: Private Arr network
  community.docker.docker_network:
    name: "{{ arr_network_name }}"
    internal: true
    labels:
      arr: "true"
  tags:
    - profilarr
    - arr

- name: Create Docker paths
  ansible.builtin.file:
    path: "{{ docker_data_dir }}/{{ item }}"
    state: directory
    owner: docker
    group: docker
    mode: '0755'
  with_items:
    - profilarr_config
  tags:
    - profilarr
    - arr


- name: Recreate profilarr container
  community.docker.docker_container:
    name: profilarr
    image: ghcr.io/dictionarry-hub/profilarr:{{ profilarr_version }}
    state: started
    restart_policy: "{{ docker_restart_condition }}"
    recreate: true
    restart: true
    pull: true
    volumes:
      - /etc/localtime:/ect/localtime:ro # Timezone sync always include this volume.
      - "{{ docker_data_dir }}/profilarr_config:/config"
    dns_search_domains: "{{ dns_domains }}"
    dns_servers: "{{ dns_servers }}"
    log_driver: "{{ docker_log_driver }}"
    log_options: "{{ docker_log_options }}"
    labels:
      traefik.enable: "true"
      traefik.http.routers.profilarr.rule: Host(`{{ profilarr_app_name }}.{{ traefik_arr_domain }}`)
      traefik.http.routers.profilarr.tls: "true"
      traefik.http.routers.profilarr.entrypoints: websecure
      traefik.http.services.profilarr.loadbalancer.server.port: "6868"
    networks_cli_compatible: false
    networks:
      - name: "{{ arr_network_name }}"
        aliases:
          - profilarr.mcharryville.space
          - profilarr.arr.mcharryville.space
          - profilarr
      - name: traefik_proxy
        aliases:
          - profilarr.mcharryville.space
          - profilarr
    env:
      PUID: "1000"
      GUID: "1000"
      TZ: "America/Chicago"
      AUTH: "off"
      ORIGIN: "https://{{ profilarr_app_name }}.{{ traefik_arr_domain }}"
  tags:
    - profilarr
    - arr
