arr_network_name: "tortuga"
sonarr_app_name: "sonarr"
sonarr_version: "latest"

radarr_app_name: "radarr"
radarr_version: "latest"

lidarr_app_name: "lidarr"
deluge_app_name: "deluge"
deluge_version: "latest"

seerr_app_name: "seerr"
seerr_version: "latest"

prowlarr_app_name: "prowlarr"
prowlarr_version: "latest"

profilarr_app_name: "profilarr"
profilarr_version: "latest"

docker_sonarr_storage_tv: "/mnt/storage/TV/"

trackarr_app_name: "trackarr"
trackarr_version: "v0.2.2"
trackarr_db_password: "{{ vault_trackarr_db_password }}"